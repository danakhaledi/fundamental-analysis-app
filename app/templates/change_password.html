{% extends "base.html" %}{% block auth_content %}
<section class="login"><div class="logo">ف</div><p class="eyebrow">ACCOUNT SECURITY</p><h1>تغییر کلمه عبور</h1><div class="alert warning">برای امنیت حساب مدیر کل، قبل از ورود به سامانه باید کلمه عبور پیش‌فرض را تغییر دهید.</div>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form method="post" action="/change-password"><label>کلمه عبور فعلی<input name="current_password" type="password" required></label><label>کلمه عبور جدید<input name="new_password" type="password" minlength="10" required></label><label>تکرار کلمه عبور جدید<input name="confirm_password" type="password" minlength="10" required></label><button class="primary">ثبت کلمه عبور جدید</button></form></section>{% endblock %}
